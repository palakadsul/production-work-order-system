---
- name: Configure PWOS application node
  hosts: pwos_nodes
  vars:
    # Release to deploy. Override with: -e pwos_version=10
    pwos_version: "12"
    registry: localhost:5001
    image: "{{ registry }}/pwos:{{ pwos_version }}"
    jar_in_image: /app/app.jar
    artifact_dir: "{{ playbook_dir }}/artifacts"
    artifact_jar: "{{ artifact_dir }}/pwos-{{ pwos_version }}.jar"
    extract_name: "pwos-extract-{{ pwos_version }}"

    app_user: pwos
    app_dir: /opt/pwos
    log_dir: /var/log/pwos
    conf_dir: /etc/pwos
    app_port: 8080
    db_url: "jdbc:postgresql://host.docker.internal:5432/pwos_db"

  tasks:
    - name: Install Java 21, curl and supervisor
      ansible.builtin.apt:
        name:
          - openjdk-21-jre-headless
          - curl
          - supervisor
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the pwos system user
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create application, log and config folders
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        mode: "0755"
      loop:
        - { path: "{{ app_dir }}", owner: "{{ app_user }}" }
        - { path: "{{ log_dir }}", owner: "{{ app_user }}" }
        - { path: "{{ conf_dir }}", owner: root }

    # ---- Fetch the requested release from the registry (runs on the laptop) ----
    - name: Make sure the local artifact folder exists
      ansible.builtin.file:
        path: "{{ artifact_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Extract the jar of the requested release from the registry image
      delegate_to: localhost
      block:
        - name: Remove any leftover extract container
          ansible.builtin.command: docker rm -f {{ extract_name }}
          changed_when: false
          failed_when: false

        - name: Create a stopped container from the release image
          ansible.builtin.command: docker create --name {{ extract_name }} {{ image }}
          changed_when: false

        - name: Copy the jar out of the container
          ansible.builtin.command: docker cp {{ extract_name }}:{{ jar_in_image }} {{ artifact_jar }}
          changed_when: false
      always:
        - name: Remove the extract container
          ansible.builtin.command: docker rm -f {{ extract_name }}
          changed_when: false
          failed_when: false

    - name: Copy the application jar (version {{ pwos_version }})
      ansible.builtin.copy:
        src: "{{ artifact_jar }}"
        dest: "{{ app_dir }}/app.jar"
        owner: "{{ app_user }}"
        mode: "0644"
      notify: Restart pwos

    - name: Write the environment file
      ansible.builtin.copy:
        dest: "{{ conf_dir }}/pwos.env"
        owner: root
        group: "{{ app_user }}"
        mode: "0640"
        content: |
          SERVER_PORT={{ app_port }}
          SPRING_DATASOURCE_URL={{ db_url }}
      notify: Restart pwos

    - name: Write the supervisor service definition
      ansible.builtin.copy:
        dest: /etc/supervisor/conf.d/pwos.conf
        mode: "0644"
        content: |
          [program:pwos]
          command=/bin/bash -c 'set -a; . {{ conf_dir }}/pwos.env; exec java -jar {{ app_dir }}/app.jar'
          user={{ app_user }}
          directory={{ app_dir }}
          autostart=true
          autorestart=true
          stdout_logfile={{ log_dir }}/pwos.log
          redirect_stderr=true
      notify: Restart pwos

    - name: Check whether supervisord is running
      ansible.builtin.stat:
        path: /var/run/supervisor.sock
      register: supervisor_socket

    - name: Start supervisord
      ansible.builtin.command: /usr/bin/supervisord -c /etc/supervisor/supervisord.conf
      when: not supervisor_socket.stat.exists

    - name: Apply any pending service changes
      ansible.builtin.meta: flush_handlers

    - name: Health check on the app port
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/"
        status_code: 200
      register: health
      retries: 15
      delay: 4
      until: health.status == 200

    - name: Report the deployed release
      ansible.builtin.debug:
        msg: "PWOS release {{ pwos_version }} is deployed and healthy (HTTP {{ health.status }})"

  handlers:
    - name: Restart pwos
      ansible.builtin.shell: supervisorctl update && supervisorctl restart pwos