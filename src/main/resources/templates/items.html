<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Item Catalogue - PWOS</title>
    <link
        rel="stylesheet"
        th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
    <div
        th:replace="~{fragments :: sidebar('items')}"></div>

    <div class="main">
        <h1>Item Catalogue</h1>
        <p class="subtitle">Track stock levels and reorder thresholds</p>

        <div class="stats">
            <div class="stat blue">
                <div class="label">Total items</div>
                <div
                    class="value"
                    th:text="${totalItems}">0</div>
            </div>
            <div class="stat red">
                <div class="label">Low stock</div>
                <div
                    class="value"
                    th:text="${lowStockItems.size()}">0</div>
            </div>
        </div>

        <div
            class="notice"
            th:if="${message}">
            <span th:text="${message}"></span>
        </div>

        <div
            class="alert"
            th:if="${formError}">
            <span th:text="${formError}"></span>
        </div>

        <div
            class="alert"
            th:if="${deleteError}">
            <span th:text="${deleteError}"></span>
        </div>

        <div
            class="alert"
            th:if="${!lowStockItems.isEmpty()}">
            <strong>⚠ Low Stock Alert:</strong>
            <span th:each="li, iter : ${lowStockItems}">
                <span th:text="${li.name}"></span><span th:if="${!iter.last}">, </span>
            </span>
            <span th:text="${lowStockItems.size()} + ' item(s) at or below reorder threshold.'"></span>
        </div>

        <div class="card">
            <form
                th:action="@{/items}"
                method="get"
                class="search-bar">
                <input
                    type="text"
                    name="q"
                    th:value="${q}"
                    placeholder="Search by name or SKU">
                <button
                    type="submit"
                    class="btn-primary">Search</button>
                <a
                    th:if="${!q.isEmpty()}"
                    th:href="@{/items}"
                    class="btn-edit">Clear</a>
            </form>
            <p
                class="search-info"
                th:if="${!q.isEmpty()}"
                th:text="${items.size()} + ' result(s) for: ' + ${q}"></p>

            <table>
                <tr>
                    <th>ID</th><th>Name</th><th>SKU</th><th>Quantity</th><th>Reorder Threshold</th><th></th>
                </tr>
                <tr th:each="item : ${items}">
                    <td th:text="${item.id}"></td>
                    <td th:text="${item.name}"></td>
                    <td th:text="${item.sku}"></td>
                    <td>
                        <span
                            th:class="${item.quantity <= item.reorderThreshold} ? 'qty-low' : 'qty-ok'"
                            th:text="${item.quantity}"></span>
                    </td>
                    <td th:text="${item.reorderThreshold}"></td>
                    <td>
                        <div class="row-actions">
                            <a
                                th:href="@{/items/{id}/edit(id=${item.id})}"
                                class="btn-edit">Edit</a>
                            <form
                                th:action="@{/items/{id}/delete(id=${item.id})}"
                                method="post">
                                <button
                                    type="submit"
                                    class="btn-delete">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </table>
            <p
                class="search-info"
                th:if="${items.isEmpty()}">No items to show.</p>
        </div>

        <div class="card">
            <h3>Add New Item</h3>
            <form
                th:action="@{/items}"
                method="post"
                class="form-row">
                <input
                    type="text"
                    name="name"
                    placeholder="Name"
                    required>
                <input
                    type="text"
                    name="sku"
                    placeholder="SKU"
                    required>
                <input
                    type="number"
                    name="quantity"
                    placeholder="Quantity"
                    min="0"
                    required>
                <input
                    type="number"
                    name="reorderThreshold"
                    placeholder="Reorder Threshold"
                    min="0"
                    required>
                <button
                    type="submit"
                    class="btn-primary">Add Item</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
