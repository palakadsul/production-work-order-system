<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign in - PWOS</title>
    <link
        rel="stylesheet"
        th:href="@{/css/style.css}">
</head>
<body>
<div class="login-wrap">
    <div class="card login-card">
        <div class="brand-icon">🏭</div>
        <h1>PWOS</h1>
        <p class="subtitle">Production Work Order System</p>

        <div
            class="alert"
            th:if="${param.error}">Wrong username or password.</div>
        <div
            class="notice"
            th:if="${param.logout}">You have been logged out.</div>

        <form
            th:action="@{/login}"
            method="post"
            class="login-form">
            <label class="field">Username
                <input
                    type="text"
                    name="username"
                    autofocus
                    required>
            </label>
            <label class="field">Password
                <input
                    type="password"
                    name="password"
                    required>
            </label>
            <button
                type="submit"
                class="btn-primary">Sign in</button>
        </form>
        <p class="search-info">Demo users: admin, supervisor, clerk, viewer</p>
    </div>
</div>
</body>
</html>
