<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div
    class="sidebar"
    th:fragment="sidebar(active)">
    <a
        class="brand"
        th:href="@{/}">
        <div class="brand-icon">🏭</div>
        <div class="brand-name">PWOS</div>
        <div class="brand-sub">Production Work Order System</div>
    </a>
    <div class="nav-panel">
        <a
            class="nav-item"
            th:classappend="${active == 'home'} ? 'active'"
            th:href="@{/}">
            <span class="nav-icon">🏠</span>Dashboard
        </a>
        <a
            class="nav-item"
            th:classappend="${active == 'items'} ? 'active'"
            th:href="@{/items}">
            <span class="nav-icon">📦</span>Item Catalogue
        </a>
        <a
            class="nav-item"
            th:classappend="${active == 'orders'} ? 'active'"
            th:href="@{/orders}">
            <span class="nav-icon">📋</span>Work Orders
        </a>
        <a
            class="nav-item"
            th:if="${canViewHistory}"
            th:classappend="${active == 'history'} ? 'active'"
            th:href="@{/history}">
            <span class="nav-icon">🕘</span>History
        </a>
    </div>
    <div
        class="user-panel"
        th:if="${currentUser != null}">
        <div
            class="user-name"
            th:text="${currentUser}">user</div>
        <div
            class="user-role"
            th:text="${currentRole}">ROLE</div>
        <form
            th:action="@{/logout}"
            method="post">
            <button
                type="submit"
                class="btn-logout">Log out</button>
        </form>
    </div>
</div>
</body>
</html>
