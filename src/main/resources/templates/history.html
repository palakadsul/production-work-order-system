<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>History - PWOS</title>
    <link
        rel="stylesheet"
        th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
    <div
        th:replace="~{fragments :: sidebar('history')}"></div>

    <div class="main">
        <h1>History</h1>
        <p class="subtitle">Who changed what, and when (latest 200 changes)</p>
        <a class="btn-edit export-link" th:href="@{/export/history.csv}">⬇ Export CSV</a>

        <div class="card">
            <table>
                <tr>
                    <th>When</th><th>User</th><th>Action</th><th>What</th><th>Details</th>
                </tr>
                <tr th:each="e : ${@pagingService.page(entries, param.page).content()}">
                    <td th:text="${#temporals.format(e.eventTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
                    <td th:text="${e.username}"></td>
                    <td>
                        <span
                            class="badge"
                            th:classappend="'act-' + ${e.action}"
                            th:text="${e.action}"></span>
                    </td>
                    <td th:text="${e.entityType} + ' #' + ${e.entityId}"></td>
                    <td th:text="${e.details}"></td>
                </tr>
            </table>
            <th:block th:with="pg=${@pagingService.page(entries, param.page)}"><div class="pager" th:if="${pg.totalPages() > 1}">
                <a th:if="${pg.hasPrev()}" th:href="@{/history(page=${pg.page() - 1})}">&laquo; Prev</a>
                <span th:text="${'Page ' + pg.page() + ' of ' + pg.totalPages() + '  (' + pg.from() + '-' + pg.to() + ' of ' + pg.total() + ')'}">Page 1 of 1</span>
                <a th:if="${pg.hasNext()}" th:href="@{/history(page=${pg.page() + 1})}">Next &raquo;</a>
            </div></th:block>
            <p
                class="search-info"
                th:if="${entries.isEmpty()}">No changes recorded yet.</p>
        </div>
    </div>
</div>
</body>
</html>
