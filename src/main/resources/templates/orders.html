<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Work Orders - PWOS</title>
    <link
        rel="stylesheet"
        th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
    <div
        th:replace="~{fragments :: sidebar('orders')}"></div>

    <div class="main">
        <h1>Work Orders</h1>
        <p class="subtitle">Create and track production orders</p>

        <div class="stats">
            <div class="stat blue">
                <div class="label">Orders shown</div>
                <div
                    class="value"
                    th:text="${orders.size()}">0</div>
            </div>
            <div class="stat red">
                <div class="label">Overdue</div>
                <div
                    class="value"
                    th:text="${overdueOrders.size()}">0</div>
            </div>
        </div>

        <div
            class="notice"
            th:if="${message}">
            <span th:text="${message}"></span>
        </div>

        <div
            class="alert"
            th:if="${formError}">
            <span th:text="${formError}"></span>
        </div>

        <div
            class="alert"
            th:if="${!overdueOrders.isEmpty()}">
            <strong>⚠ Overdue Orders:</strong>
            <span th:text="${overdueOrders.size()} + ' order(s) past due date and still open.'"></span>
        </div>

        <div class="card">
            <form
                th:action="@{/orders}"
                method="get"
                class="search-bar">
                <input
                    type="text"
                    name="q"
                    th:value="${q}"
                    placeholder="Search by item name or SKU">
                <select
                    name="status"
                    onchange="this.form.submit()">
                    <option value="">All statuses</option>
                    <option
                        value="PENDING"
                        th:selected="${statusFilter == 'PENDING'}">Pending</option>
                    <option
                        value="IN_PROGRESS"
                        th:selected="${statusFilter == 'IN_PROGRESS'}">In Progress</option>
                    <option
                        value="DONE"
                        th:selected="${statusFilter == 'DONE'}">Done</option>
                    <option
                        value="CANCELLED"
                        th:selected="${statusFilter == 'CANCELLED'}">Cancelled</option>
                </select>
                <button
                    type="submit"
                    class="btn-primary">Search</button>
                <a
                    th:if="${!q.isEmpty() or !statusFilter.isEmpty()}"
                    th:href="@{/orders}"
                    class="btn-edit">Clear</a>
            </form>
            <p
                class="search-info"
                th:if="${!q.isEmpty() or !statusFilter.isEmpty()}"
                th:text="${orders.size()} + ' order(s) match the current filter'"></p>

            <table>
                <tr>
                    <th>ID</th><th>Item</th><th>Quantity</th><th>Due Date</th><th>Status</th><th>Update</th><th></th>
                </tr>
                <tr th:each="order : ${orders}">
                    <td th:text="${order.id}"></td>
                    <td th:text="${order.item.name}"></td>
                    <td th:text="${order.quantity}"></td>
                    <td th:text="${order.dueDate}"></td>
                    <td>
                        <span
                            class="badge"
                            th:classappend="${order.status}"
                            th:text="${order.status}"></span>
                    </td>
                    <td>
                        <form
                            th:if="${order.status != 'CANCELLED'}"
                            th:action="@{/orders/{orderId}/status(orderId=${order.id})}"
                            method="post"
                            class="inline-form">
                            <select
                                name="status"
                                onchange="this.form.submit()">
                                <option
                                    value="PENDING"
                                    th:selected="${order.status == 'PENDING'}">Pending</option>
                                <option
                                    value="IN_PROGRESS"
                                    th:selected="${order.status == 'IN_PROGRESS'}">In Progress</option>
                                <option
                                    value="DONE"
                                    th:selected="${order.status == 'DONE'}">Done</option>
                            </select>
                        </form>
                        <span
                            th:if="${order.status == 'CANCELLED'}"
                            class="search-info">-</span>
                    </td>
                    <td>
                        <div class="row-actions">
                            <a
                                th:if="${order.status == 'PENDING' or order.status == 'IN_PROGRESS'}"
                                th:href="@{/orders/{orderId}/edit(orderId=${order.id})}"
                                class="btn-edit">Edit</a>
                            <form
                                th:if="${order.status == 'PENDING' or order.status == 'IN_PROGRESS'}"
                                th:action="@{/orders/{orderId}/cancel(orderId=${order.id})}"
                                method="post"
                                class="inline-form">
                                <button
                                    type="submit"
                                    class="btn-cancel">Cancel</button>
                            </form>
                            <form
                                th:if="${order.status != 'DONE'}"
                                th:action="@{/orders/{orderId}/delete(orderId=${order.id})}"
                                method="post"
                                class="inline-form">
                                <button
                                    type="submit"
                                    class="btn-delete"
                                    onclick="return confirm('Delete this order?')">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </table>
            <p
                class="search-info"
                th:if="${orders.isEmpty()}">No orders to show.</p>
        </div>

        <div class="card">
            <h3>Create Work Order</h3>
            <form
                th:action="@{/orders}"
                method="post"
                class="form-row">
                <select
                    name="itemId"
                    required>
                    <option
                        th:each="item : ${items}"
                        th:value="${item.id}"
                        th:text="${item.name}"></option>
                </select>
                <input
                    type="number"
                    name="quantity"
                    placeholder="Quantity"
                    min="1"
                    required>
                <input
                    type="date"
                    name="dueDate">
                <button
                    type="submit"
                    class="btn-primary">Create Order</button>
            </form>
            <p class="search-info">Marking an order Done adds its quantity to the item's stock. Reopening it takes the quantity back.</p>
        </div>
    </div>
</div>
</body>
</html>
