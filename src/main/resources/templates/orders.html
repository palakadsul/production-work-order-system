<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Work Orders - PWOS</title>
    <link
        rel="stylesheet"
        th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
    <div
        th:replace="~{fragments :: sidebar('orders')}"></div>

    <div class="main">
        <h1>Work Orders</h1>
        <p class="subtitle">Create and track production orders</p>

        <div class="stats">
            <div class="stat blue">
                <div class="label">Orders shown</div>
                <div
                    class="value"
                    th:text="${orders.size()}">0</div>
            </div>
            <div class="stat red">
                <div class="label">Overdue</div>
                <div
                    class="value"
                    th:text="${overdueOrders.size()}">0</div>
            </div>
        </div>

        <div
            class="alert"
            th:if="${!overdueOrders.isEmpty()}">
            <strong>⚠ Overdue Orders:</strong>
            <span th:text="${overdueOrders.size()} + ' order(s) past due date and not yet Done.'"></span>
        </div>

        <form
            th:action="@{/orders}"
            method="get"
            style="margin-bottom:18px;">
            <select
                name="status"
                onchange="this.form.submit()">
                <option value="">All statuses</option>
                <option
                    value="PENDING"
                    th:selected="${statusFilter == 'PENDING'}">Pending</option>
                <option
                    value="IN_PROGRESS"
                    th:selected="${statusFilter == 'IN_PROGRESS'}">In Progress</option>
                <option
                    value="DONE"
                    th:selected="${statusFilter == 'DONE'}">Done</option>
            </select>
        </form>

        <div class="card">
            <table>
                <tr>
                    <th>ID</th><th>Item</th><th>Quantity</th><th>Due Date</th><th>Status</th><th>Update</th>
                </tr>
                <tr th:each="order : ${orders}">
                    <td th:text="${order.id}"></td>
                    <td th:text="${order.item.name}"></td>
                    <td th:text="${order.quantity}"></td>
                    <td th:text="${order.dueDate}"></td>
                    <td>
                        <span
                            class="badge"
                            th:classappend="${order.status}"
                            th:text="${order.status}"></span>
                    </td>
                    <td>
                        <form
                            th:action="@{/orders/{orderId}/status(orderId=${order.id})}"
                            method="post">
                            <select
                                name="status"
                                onchange="this.form.submit()">
                                <option
                                    value="PENDING"
                                    th:selected="${order.status == 'PENDING'}">Pending</option>
                                <option
                                    value="IN_PROGRESS"
                                    th:selected="${order.status == 'IN_PROGRESS'}">In Progress</option>
                                <option
                                    value="DONE"
                                    th:selected="${order.status == 'DONE'}">Done</option>
                            </select>
                        </form>
                    </td>
                </tr>
            </table>
        </div>

        <div class="card">
            <h3>Create Work Order</h3>
            <form
                th:action="@{/orders}"
                method="post"
                class="form-row">
                <select
                    name="itemId"
                    required>
                    <option
                        value=""
                        disabled
                        selected>Select item</option>
                    <option
                        th:each="item : ${items}"
                        th:value="${item.id}"
                        th:text="${item.name}"></option>
                </select>
                <input
                    type="number"
                    name="quantity"
                    placeholder="Quantity"
                    required>
                <input
                    type="date"
                    name="dueDate">
                <button
                    type="submit"
                    class="btn-primary">Create Order</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
