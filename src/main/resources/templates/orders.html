<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Work Orders - PWOS</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, 'Inter', 'Segoe UI', Arial, sans-serif;
            margin: 0;
            background: #f4f5fb;
            color: #1f2233;
        }
        .wrap { max-width: 1100px; margin: 0 auto; padding: 48px 32px; }
        h1 { font-size: 28px; font-weight: 700; margin: 0 0 4px; }
        .subtitle { color: #8b8fa3; font-size: 14px; margin: 0 0 24px; }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 1px 3px rgba(20,20,50,0.06), 0 8px 24px rgba(20,20,50,0.04);
            padding: 28px;
            margin-bottom: 28px;
        }
        .filter-bar { margin-bottom: 20px; }
        .filter-bar select {
            padding: 9px 14px;
            border-radius: 8px;
            border: 1px solid #e4e6f0;
            background: #fff;
            font-size: 14px;
        }
        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #9295a8;
            font-weight: 600;
            padding: 0 12px 12px;
            border-bottom: 1px solid #eceef5;
        }
        td {
            padding: 14px 12px;
            border-bottom: 1px solid #f2f3f8;
            font-size: 14px;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fafbfe; }
        .badge {
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
        }
        .badge.PENDING { background: #f0a446; }
        .badge.IN_PROGRESS { background: #4a90e2; }
        .badge.DONE { background: #34c38f; }
        select.status-select {
            padding: 7px 10px;
            border-radius: 8px;
            border: 1px solid #e4e6f0;
            font-size: 13px;
        }
        .card h3 { margin: 0 0 20px; font-size: 16px; font-weight: 700; }
        .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
        .form-row input, .form-row select {
            flex: 1;
            min-width: 140px;
            padding: 11px 14px;
            border: 1px solid #e4e6f0;
            border-radius: 10px;
            font-size: 14px;
            background: #fbfbfe;
        }
        .form-row input:focus, .form-row select:focus { outline: none; border-color: #6c63ff; background: #fff; }
        .btn-primary {
            background: #6c63ff;
            color: #fff;
            border: none;
            padding: 11px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-primary:hover { background: #5a52e0; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Work Orders</h1>
    <p class="subtitle">Create and track production orders</p>
    <div th:if="${!overdueOrders.isEmpty()}" style="background:#fdecea; border:1px solid #f5c6c0; color:#a5302a; padding:14px 20px; border-radius:12px; margin-bottom:24px; font-size:14px;">
        <strong>⚠ Overdue Orders:</strong>
        <span th:text="${overdueOrders.size()} + ' order(s) past due date and not yet Done.'"></span>
    </div>


    <div class="filter-bar">
        <form th:action="@{/orders}" method="get">
            <select name="status" class="status-select" onchange="this.form.submit()">
                <option value="">All statuses</option>
                <option value="PENDING" th:selected="${statusFilter == 'PENDING'}">Pending</option>
                <option value="IN_PROGRESS" th:selected="${statusFilter == 'IN_PROGRESS'}">In Progress</option>
                <option value="DONE" th:selected="${statusFilter == 'DONE'}">Done</option>
            </select>
        </form>
    </div>

    <div class="card">
        <table>
            <tr>
                <th>ID</th><th>Item</th><th>Quantity</th><th>Due Date</th><th>Status</th><th>Update</th>
            </tr>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}"></td>
                <td th:text="${order.item.name}"></td>
                <td th:text="${order.quantity}"></td>
                <td th:text="${order.dueDate}"></td>
                <td><span class="badge" th:classappend="${order.status}" th:text="${order.status}"></span></td>
                <td>
                    <form th:action="@{/orders/{orderId}/status(orderId=${order.id})}" method="post">
                        <select name="status" class="status-select" onchange="this.form.submit()">
                            <option value="PENDING" th:selected="${order.status == 'PENDING'}">Pending</option>
                            <option value="IN_PROGRESS" th:selected="${order.status == 'IN_PROGRESS'}">In Progress</option>
                            <option value="DONE" th:selected="${order.status == 'DONE'}">Done</option>
                        </select>
                    </form>
                </td>
            </tr>
        </table>
    </div>

    <div class="card">
        <h3>Create Work Order</h3>
        <form th:action="@{/orders}" method="post" class="form-row">
            <select name="itemId">
                <option
                    th:each="item : ${items}"
                    th:value="${item.id}"
                    th:text="${item.name}">
                </option>
            </select>
            <input type="number" name="quantity" placeholder="Quantity" required>
            <input type="date" name="dueDate">
            <button type="submit" class="btn-primary">Create Order</button>
        </form>
    </div>
</div>
</body>
</html>
