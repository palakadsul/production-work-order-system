spring.application.name=ProductionWorkOrderSystem
spring.datasource.url=jdbc:postgresql://localhost:5432/pwos_db
spring.datasource.username=pwos_user
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8080
# All secrets come from environment variables (see ~/.pwos/pwos.env). Never commit real values.
pwos.users.admin-password=${PWOS_ADMIN_PASSWORD}
pwos.users.supervisor-password=${PWOS_SUPERVISOR_PASSWORD}
pwos.users.clerk-password=${PWOS_CLERK_PASSWORD}
pwos.users.viewer-password=${PWOS_VIEWER_PASSWORD}

# Monitoring: health check and Prometheus metrics
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=pwos

# Database migrations: versioned SQL files in src/main/resources/db/migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
