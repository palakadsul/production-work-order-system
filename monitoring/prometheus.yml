global:
  scrape_interval: 15s

scrape_configs:
  - job_name: pwos
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels: { server: "live-8081" }
      - targets: ["host.docker.internal:8082"]
        labels: { server: "node-8082" }
      - targets: ["host.docker.internal:8095"]
        labels: { server: "local-test-8095" }
